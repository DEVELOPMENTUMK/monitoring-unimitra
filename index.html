    <style>
        :root { 
            --primary: #2563eb; 
            --success: #10b981; 
            --danger: #ef4444; 
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; color: #1e293b; overflow-x: hidden; }
        
        #loginOverlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            display:flex; justify-content:center; align-items:center; z-index:2000; 
        }
        .login-card { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; outline:none; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        #menuSelection { min-height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
        
        .prayer-widget {
            background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; border: 1px solid #e2e8f0;
        }
        .prayer-item { text-align: center; padding: 10px 15px; border-radius: 12px; background: #f8fafc; min-width: 80px; border: 1px solid #f1f5f9; }
        .prayer-name { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .prayer-time { font-size: 16px; font-weight: 700; color: var(--primary); }

        .menu-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        .menu-card { background: white; width: 220px; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .menu-icon { font-size: 50px; margin-bottom: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 25px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .main-container { padding: 20px; max-width: 1300px; margin: auto; }

        .modern-card { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
