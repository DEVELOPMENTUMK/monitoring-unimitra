<div class="prayer-widget" style="flex-direction: column; align-items: center;">
    <div id="prayerTimes" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
        <div style="font-size: 12px; color: #64748b;">Memuat jadwal sholat...</div>
    </div>
    <div id="displayDate" style="margin-top: 15px; font-size: 13px; font-weight: 700; color: #475569; border-top: 1px dashed #cbd5e1; padding-top: 10px; width: 100%; text-align: center;">
        <span id="tglMasehi">-- --- ----</span> 
        <span style="margin: 0 10px; color: #cbd5e1;">|</span> 
        <span id="tglHijriah" style="color: #b45309;">-- --- ---- H</span>
    </div>
</div>

<script>
// Update fungsi getPrayerTimes Anda menjadi seperti ini:
async function getPrayerTimes() {
    try {
        const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Bogor&country=Indonesia&method=11');
        const data = await response.json();
        const timings = data.data.timings;
        const date = data.data.date; // Ambil data tanggal dari API

        const displayTimes = [
            {name: 'Subuh', time: timings.Fajr},
            {name: 'Dzuhur', time: timings.Dhuhr},
            {name: 'Ashar', time: timings.Asr},
            {name: 'Maghrib', time: timings.Maghrib},
            {name: 'Isya', time: timings.Isha}
        ];

        let html = "";
        displayTimes.forEach(pt => {
            html += `
                <div class="prayer-item">
                    <div class="prayer-name">${pt.name}</div>
                    <div class="prayer-time">${pt.time}</div>
                </div>`;
        });
        
        // Render Jadwal Sholat
        document.getElementById('prayerTimes').innerHTML = html;

        // Render Tanggal Masehi dan Hijriah
        document.getElementById('tglMasehi').innerText = date.readable;
        document.getElementById('tglHijriah').innerText = date.hijri.day + " " + date.hijri.month.en + " " + date.hijri.year + " H";

    } catch (e) {
        document.getElementById('prayerTimes').innerHTML = "Gagal memuat jadwal.";
    }
}
</script>
